<style>
*{
    margin: 0;
    padding: 0;
    list-style: none;
    text-decoration: none;
}

.header{
    display: block;

    width: 100%;
    height: 3rem;

    background-color: #101010;
}

.inner-header{
    display: block;

    width: 90%;
    height: 100%;
    margin: 0 auto;
}

.logo-container{
    display: table;
    float: left;

    height: 100%;
}

.logo-container h1{
    display: table-cell;

    height: 100%;
    vertical-align: middle;

    font-family: 'Montserrat';
    font-size: 2rem;
    color: white;
}

.navigation{
    height: 100%;
    float: right;
}

.navigation a{
    display: table;

    height: 100%;
    padding: 0 1rem;
    float: left;
}

.navigation a:last-child{
    padding-right: 0;
}

.navigation a li{
    display: table-cell;
    vertical-align: middle;

    height: 100%;

    font-family: 'Montserrat';
    font-size: 1rem;
    color: white;
    transition: color 0.3s ease;
}

.navigation a li:hover{
    color: #f0a500;
}
/* AI */
@media (max-width: 526px) {
    .header {
        height: auto;
    }

    .inner-header {
        width: 100%;
        padding: 0 1rem;
    }

    .logo-container {
        float: none;
        text-align: center;
        margin-bottom: 1rem;
    }

    .navigation {
        float: none;
        text-align: center;
    }

    .navigation a {
        display: block;
        float: none;
        padding: 0.5rem 0;
    }
}
</style>
<header>
    <div class="header">
        <div class="inner-header">
            <div class="logo-container">
                <h1>SP</h1> 
            </div>
            <ul class="navigation">
                <a href="/index.html"><li>Главная</li></a>
                <a href="/assets/html/users.html"><li>Пользователям</li></a>
                <a href="/assets/html/administration.html"><li>Администраторам</li></a>
            </ul>
        </div>
    </div>
</header>
